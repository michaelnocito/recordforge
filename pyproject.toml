[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recordforge"
version = "2.1.0"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=4.4",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Parquet output is opt-in: pyarrow is large and intentionally NOT bundled in
# the Windows installer, so it stays a pip/CLI-only extra.
parquet = ["pyarrow>=15"]

[project.scripts]
recordforge = "recordforge.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["recordforge*"]
